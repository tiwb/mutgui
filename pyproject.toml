[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mutgui"
version = "0.1.999"
description = "A Python/C++ GUI framework based on mutobj"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "tiwb"},
]
keywords = ["gui", "c++", "python", "mutobj"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "mutobj~=0.7.0",
]

[project.optional-dependencies]
demo = [
    "mutio",
]
test = [
    "mutio",
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "playwright>=1.40",
]
dev = [
    "mutgui[test]",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/tiwb/mutgui"
Repository = "https://github.com/tiwb/mutgui"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mutgui*"]

[tool.setuptools.package-data]
mutgui = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: full-stack integration tests (require browser)",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pyright]
pythonVersion = "3.11"
include = ["src"]
extraPaths = ["src"]
typeCheckingMode = "strict"
